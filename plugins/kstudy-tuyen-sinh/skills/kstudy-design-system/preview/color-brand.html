<!doctype html>
<!-- @dsCard group="Colors" name="Brand core colors" subtitle="Navy · bright blue · yellow · cyan" viewport="700x220" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}
.swrow{display:flex;gap:14px;margin-top:10px}
</style></head><body><div class="wrap">
<div class="lbl">Brand core</div>
<div class="swrow">
<div style="flex:1">
<div style="height:84px;border-radius:12px;background:#1D237D;"></div>
<div style="font-family:var(--font-sans);font-weight:600;font-size:14px;margin-top:9px;color:var(--ink)">Navy</div>
<div class="mono">--navy</div><div class="mono" style="text-transform:uppercase">#1D237D</div></div>
<div style="flex:1">
<div style="height:84px;border-radius:12px;background:#247DF9;"></div>
<div style="font-family:var(--font-sans);font-weight:600;font-size:14px;margin-top:9px;color:var(--ink)">Bright blue</div>
<div class="mono">--blue</div><div class="mono" style="text-transform:uppercase">#247DF9</div></div>
<div style="flex:1">
<div style="height:84px;border-radius:12px;background:#FFD84D;border:1px solid var(--line);"></div>
<div style="font-family:var(--font-sans);font-weight:600;font-size:14px;margin-top:9px;color:var(--ink)">Yellow</div>
<div class="mono">--yellow</div><div class="mono" style="text-transform:uppercase">#FFD84D</div></div>
</div></div></body></html>
