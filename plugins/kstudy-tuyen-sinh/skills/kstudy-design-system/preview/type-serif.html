<!doctype html>
<!-- @dsCard group="Type" name="Serif accent — Rokkitt" subtitle="Slab for quotes & stat figures" viewport="700x250" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}

.q{font-family:var(--font-serif);font-weight:400;font-size:38px;line-height:1.22;color:var(--navy);letter-spacing:-.005em}
.fig{font-family:var(--font-serif);font-weight:600;font-size:64px;color:var(--blue-500);line-height:1;margin-top:6px}
.eye{font-family:var(--font-sans);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-500);margin-top:18px}

</style></head><body><div class="wrap">
<div class="lbl">Serif accent — Rokkitt</div>
<div class="q">“Học cùng người thật, dự án thật.”</div>
<div class="fig">+200%</div>
<div class="eye">Eyebrow · Google Sans Flex caps</div></div></body></html>
