<!doctype html>
<!-- @dsCard group="Type" name="Display type — Oswald" subtitle="Condensed display · ALL CAPS · line-height 1.3 · Vietnamese" viewport="700x300" --><html lang="vi"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}
.big{font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1.15;letter-spacing:-.005em;color:var(--navy);text-transform:uppercase;margin-top:4px}
.ramp{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.r{display:flex;align-items:baseline;gap:18px}
.r .n{font-family:var(--font-sans);font-size:11px;color:var(--slate-500);width:74px;flex:none}
.r .s{font-family:var(--font-display);font-size:28px;line-height:1;color:var(--ink)}
</style></head><body><div class="wrap">
<div class="lbl">Display — Google Sans Flex · weight 400–700 · tối ưu tiếng Việt</div>
<div class="big">Đào tạo AI &amp; Automation</div>
<div class="ramp">
  <div class="r"><span class="n">Regular · 400</span><span class="s" style="font-weight:400">Tự động hoá tiếp thị</span></div>
  <div class="r"><span class="n">Medium · 500</span><span class="s" style="font-weight:500">Tự động hoá tiếp thị</span></div>
  <div class="r"><span class="n">Semibold · 600</span><span class="s" style="font-weight:600">Tự động hoá tiếp thị</span></div>
  <div class="r"><span class="n">Bold · 700</span><span class="s" style="font-weight:700">Tự động hoá tiếp thị</span></div>
</div>
</div></body></html>
