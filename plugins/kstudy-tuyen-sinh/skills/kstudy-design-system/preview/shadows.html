<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation / shadows" subtitle="Cool navy-tinted + blue glow" viewport="700x175" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
