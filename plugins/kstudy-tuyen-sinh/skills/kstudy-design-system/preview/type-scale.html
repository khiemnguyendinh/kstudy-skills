<!doctype html>
<!-- @dsCard group="Type" name="Type scale (slides)" subtitle="1920×1080 sizing tokens" viewport="700x240" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}

.r{display:flex;align-items:baseline;gap:18px;padding:7px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:none}
.s{font-family:var(--font-display);color:var(--navy);font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.t{font-family:var(--font-sans);font-size:11px;color:var(--slate-500);width:120px;text-align:right;flex:none}

</style></head><body><div class="wrap">
<div class="lbl" style="margin-bottom:8px">Slide type scale (1920×1080)</div>
<div class="r"><div class="s" style="font-size:46px">Hero 112</div><div class="t">--t-hero</div></div>
<div class="r"><div class="s" style="font-size:38px">Title 84</div><div class="t">--t-display</div></div>
<div class="r"><div class="s" style="font-size:30px">Section head 64</div><div class="t">--t-h1</div></div>
<div class="r"><div class="s" style="font-size:24px;font-family:var(--font-sans);font-weight:600">Body 26 · Google Sans</div><div class="t">--t-body</div></div></div></body></html>
