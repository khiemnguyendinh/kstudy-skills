<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8pt base" viewport="700x270" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}
.bar{background:var(--blue-500);height:16px;border-radius:3px}.r{display:flex;align-items:center;gap:12px;margin:6px 0}.n{font-family:var(--font-sans);font-size:11px;color:var(--slate-500);width:64px}
</style></head><body><div class="wrap">
<div class="lbl" style="margin-bottom:10px">Spacing — 8pt base</div>
<div class="r"><span class="n">4 / s-1</span><div class="bar" style="width:4px"></div></div>
<div class="r"><span class="n">8 / s-2</span><div class="bar" style="width:8px"></div></div>
<div class="r"><span class="n">16 / s-4</span><div class="bar" style="width:16px"></div></div>
<div class="r"><span class="n">24 / s-5</span><div class="bar" style="width:24px"></div></div>
<div class="r"><span class="n">32 / s-6</span><div class="bar" style="width:32px"></div></div>
<div class="r"><span class="n">48 / s-7</span><div class="bar" style="width:48px"></div></div>
<div class="r"><span class="n">64 / s-8</span><div class="bar" style="width:64px"></div></div></div></body></html>
