<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, yellow, navy, ghost" viewport="700x190" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em;padding:13px 24px;border-radius:999px;border:none;cursor:pointer;line-height:1;white-space:nowrap}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--blue-500);color:#fff;box-shadow:var(--shadow-blue)}
.yellow{background:var(--yellow-500);color:var(--navy-900)}
.navy{background:var(--navy-700);color:#fff}
.ghost{background:transparent;color:var(--blue-600);border:2px solid var(--blue-200)}

</style></head><body><div class="wrap">
<div class="lbl">Buttons</div>
<div class="row">
<button class="btn primary"><i data-lucide="calendar-check"></i> Đăng ký tư vấn</button>
<button class="btn yellow">Bắt đầu ngay</button>
<button class="btn navy">Xem lộ trình</button>
<button class="btn ghost">Tìm hiểu <i data-lucide="arrow-right"></i></button>
</div><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><script>lucide.createIcons()</script></div></body></html>
