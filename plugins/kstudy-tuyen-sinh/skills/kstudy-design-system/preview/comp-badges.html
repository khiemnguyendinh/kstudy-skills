<!doctype html>
<!-- @dsCard group="Components" name="Icon badges" subtitle="Lucide, 2px stroke" viewport="700x130" --><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{padding:26px 30px}
.lbl{font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-500)}
.mono{font-family:var(--font-sans);font-size:12px;color:var(--slate-500)}

.ib{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.ib svg{width:30px;height:30px}
.row{display:flex;gap:16px;align-items:center;margin-top:14px}
.blue{background:var(--blue-50);color:var(--blue-600)}
.navy{background:var(--navy-700);color:#fff}
.yellow{background:var(--yellow-100);color:var(--yellow-600)}
.grad{background:var(--grad-brand);color:#fff}

</style></head><body><div class="wrap">
<div class="lbl">Icon badges — Lucide, 2px stroke</div>
<div class="row">
<div class="ib blue"><i data-lucide="brain-circuit"></i></div>
<div class="ib grad"><i data-lucide="workflow"></i></div>
<div class="ib yellow"><i data-lucide="trending-up"></i></div>
<div class="ib navy"><i data-lucide="share-2"></i></div>
<div class="ib blue"><i data-lucide="sparkles"></i></div>
<div class="ib grad"><i data-lucide="bar-chart-3"></i></div>
</div><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><script>lucide.createIcons()</script></div></body></html>
